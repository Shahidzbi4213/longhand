name: Longhand
options:
  bundleIdPrefix: com.wajahatkarim
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: 0.5.0
targets:
  Longhand:
    type: application
    platform: macOS
    sources: [Sources, Resources]
    dependencies:
      - package: Markdown
    settings:
      base:
        PRODUCT_NAME: "longhand"
        PRODUCT_BUNDLE_IDENTIFIER: com.wajahatkarim.longhand
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "longhand"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: 0.1.1
        CURRENT_PROJECT_VERSION: 2
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 4DLAG2P9L6
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # Don't add the get-task-allow debug entitlement: notarization rejects it.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
